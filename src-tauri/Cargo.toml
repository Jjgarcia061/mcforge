[package]
name = "mcforge"
version = "0.1.0"
description = "Set up your own MCP-powered AI assistant, step by step"
license = "Apache-2.0"
edition = "2024"

[lib]
name = "mcforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
sysinfo = { version = "0.40", default-features = false, features = ["disk", "system"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "mysql", "mysql-rsa", "sqlite", "chrono", "json", "rust_decimal", "uuid"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
csv = { version = "1.4.0", default-features = false }
encoding_rs = { version = "0.8.44", default-features = false }
minijinja = { version = "3.0.5", default-features = false, features = ["builtins", "macros", "serde", "std_collections"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
calamine = { version = "0.37", features = ["dates"] }
pdf-extract = "0.12"
sha2 = "0.10"
quick-xml = "0.42"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
lopdf = "0.42"
rust_xlsxwriter = { version = "0.102", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwinding (the default) lets a parser panic on one odd file be caught
# instead of closing the app; see `library::extract`.
strip = true
