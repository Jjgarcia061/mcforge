# Local models are pulled through Ollama. `size_gb` is the download size of the
# default (Q4) tag; memory needs are estimated from it in src-tauri/src/recommend.rs.
# Ratings (poor | fair | good | great) drive the recommendation after the
# setup interview:
#   tools     how reliably it calls tools (the chat always uses them)
#   analysis  reasoning over data, structured answers, report conclusions
#   code      code and SQL
#   spanish   quality in Spanish (and other languages besides English)
# `active_params_b` is set for mixture-of-experts models, which run about as fast
# as a model of that size although they need the memory of the full one.

[[local]]
id = "qwen3:4b"
name = "Qwen3 4B"
params_b = 4.0
size_gb = 2.5
tools = "fair"
analysis = "fair"
code = "fair"
spanish = "good"

