# A report for any table: key figures, the AI's conclusions, one section per
# analysis (chart or table), the columns and a preview of the data.
# Every locale must define the same labels as `en` (checked in CI).
file = "report.html"

[locales.en]
name = "Data overview"
description = "Key figures, trends and breakdowns for any table, with conclusions written by your AI."

[locales.en.labels]
rows = "Rows"
columns = "Columns"
period = "Period"
total = "Sum of {measure}"
by_month = "{measure} by month"
count_by_month = "Records by month"
by_dim = "{measure} by {dim}"
count_by_dim = "Records by {dim}"
top_rows = "Top rows by {measure}"
key_figures = "Key figures"
summary = "Summary"
highlights = "Key findings"
analysis = "Analysis"
data_columns = "Columns in the data"
column = "Column"
type = "Type"
filled = "Filled"
distinct = "Distinct"
values = "Values"
integer = "Integer"
decimal = "Decimal"
date = "Date"
text = "Text"
preview = "Data preview"
more_rows = "and {n} more rows"
source = "Source"
generated = "Generated"
engine = "Conclusions by"
question = "Question"
auto_note = "Sections were chosen automatically from the shape of the data."
print = "Print or save as PDF"
footer = "Made with MCForge. Figures come straight from the data; the AI only writes queries and text."

[locales.es]
name = "Resumen de datos"
description = "Cifras clave, tendencias y desgloses de cualquier tabla, con conclusiones escritas por tu IA."

[locales.es.labels]
rows = "Filas"
columns = "Columnas"
period = "Periodo"
