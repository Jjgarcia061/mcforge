name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: UI checks
        run: npm run check

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests (also validates the catalog)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Generated bindings are up to date
        if: runner.os == 'Linux'
        run: git diff --exit-code src/lib/bindings.ts

  databases:
    # Runs the database connector against real servers (SQLite runs in every job above).
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mcforge
          POSTGRES_PASSWORD: mcforge
          POSTGRES_DB: sales
        ports: ["54329:5432"]
        options: --health-cmd "pg_isready -U mcforge -d sales" --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sales
          MYSQL_USER: mcforge
          MYSQL_PASSWORD: mcforge
          MYSQL_ROOT_PASSWORD: mcforge
        ports: ["33069:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -umcforge -pmcforge" --health-interval 2s --health-retries 60
    env:
      MCFORGE_TEST_POSTGRES_URL: postgres://mcforge:mcforge@localhost:54329/sales
      MCFORGE_TEST_MYSQL_URL: mysql://mcforge:mcforge@localhost:33069/sales
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Database tests
        run: cargo test --manifest-path src-tauri/Cargo.toml database
